    const panel = document.getElementById("flashaccount-panel");
    const status = document.getElementById("flashaccount-status");
    const loginButton = document.getElementById("flashaccount-login");
    const logoutButton = document.getElementById("flashaccount-logout");

    let hideTimer;
    let fadeTimer;
    let account;

    function showPanel() {
      panel.classList.remove("panel-fading");
      clearTimeout(hideTimer);
      clearTimeout(fadeTimer);

      hideTimer = setTimeout(() => {
        panel.classList.add("panel-fading");
      }, 60000);

      fadeTimer = setTimeout(() => {
        panel.style.display = "none";
      }, 60260);
    }

    function updateUser(user) {
      if (user) {
        status.textContent = "Signed in as " +
          (user.displayName || user.email || "Google user");

        loginButton.hidden = true;
        logoutButton.hidden = false;
      } else {
        status.textContent = "Not signed in";
        loginButton.hidden = false;
        logoutButton.hidden = true;
      }
    }

    function showConnectionError(error) {
      console.error("FlashAccount error:", error);
      status.textContent =
        "Couldn't connect: " + (error?.message || "Unknown error");
      loginButton.disabled = true;
      logoutButton.disabled = true;
    }

    panel.addEventListener("pointerdown", showPanel);
    panel.addEventListener("keydown", showPanel);

    window.addEventListener("flashaccount-auth", event => {
      updateUser(event.detail);
    });

    showPanel();

    try {
      account = await import(
        "https://makkapakka-7788.github.io/makkapakka/flashaccount.js"
      ).then(() => window.FlashAccount);

      if (!account) {
        throw new Error(
          "FlashAccount did not initialize. Check that flashaccount.js exists in the root of your MakkaPakka repository."
        );
      }

      loginButton.addEventListener("click", async () => {
        loginButton.disabled = true;
        status.textContent = "Opening Google sign-in...";

        try {
          await account.signInWithGoogle();
        } catch (error) {
          console.error("Google sign-in failed:", error);
          status.textContent = "Sign-in failed: " + error.message;
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener("click", async () => {
        logoutButton.disabled = true;

        try {
          await account.signOut();
        } catch (error) {
          console.error("Google sign-out failed:", error);
          status.textContent = "Sign-out failed: " + error.message;
        } finally {
          logoutButton.disabled = false;
        }
      });

      updateUser(account.auth.currentUser);
    } catch (error) {
      showConnectionError(error);
    }
  </script>
